name: Build & Release Desktop and Android

on:
  push:
    tags:
      - 'v*' # Triggers whenever you push a tag like v1.0.0

permissions:
  contents: write # Required to create GitHub Releases and upload binaries

jobs:
  # --------------------------------------------------
  # 1. BUILD DESKTOP (Windows, macOS, Linux via Tauri)
  # --------------------------------------------------
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install JS dependencies & build web frontend
        run: |
          npm install
          npm run build --workspace=apps/web

      - name: Build Tauri app and upload to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Video Editor ${{ github.ref_name }}'
          releaseBody: 'Desktop installers and Android APK for ${{ github.ref_name }}.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # --------------------------------------------------
  # 2. BUILD ANDROID (APK via Capacitor & Gradle)
  # --------------------------------------------------
  build-android:
    runs-on: ubuntu-latest
    needs: build-desktop # Waits for Tauri action to create the release first
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & build web frontend
        run: |
          npm install
          npm run build --workspace=apps/web

      - name: Sync Capacitor & build debug APK
        working-directory: apps/android
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apps/android/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
